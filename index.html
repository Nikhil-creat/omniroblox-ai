<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OmniRoblox AI</title>
<style>
:root{--bg:#0b0f1a;--card:#121a2b;--tx:#e6edf3;--mut:#8b98ad;--ac:#38bdf8;--ac2:#a78bfa;--bd:#22304a}
@media(prefers-color-scheme:light){:root{--bg:#f4f7fb;--card:#fff;--tx:#0f172a;--mut:#51607a;--bd:#d6deeb}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
.w{max-width:820px;margin:auto}
h1{font-size:26px;margin:4px 0;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.s{color:var(--mut);margin:0 0 16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 4px}
input,textarea{width:100%;background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit}
textarea{min-height:90px;resize:vertical}
button{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#001;border:0;border-radius:10px;padding:11px 16px;font-weight:600;font-size:15px;margin-top:10px}
button.g{background:transparent;color:var(--ac);border:1px solid var(--bd);padding:6px 10px;font-size:12px;margin:0}
button:disabled{opacity:.5}
pre{white-space:pre-wrap;word-break:break-word;overflow-x:auto;margin:8px 0 0;font:13px/1.45 ui-monospace,monospace}
.h{display:flex;justify-content:space-between;align-items:center}
.t{font-weight:600}.b{font-size:12px;color:var(--mut)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
</style></head><body><div class="w">
<h1>OmniRoblox AI</h1>
<p class="s">Planner → Coder → Reviewer for Roblox Luau, powered by Groq. Runs in your browser.</p>
<div class="c"><label>Groq API key (stays in this tab, never stored)</label>
<input id="k" type="password" placeholder="gsk_..." autocomplete="off">
<button id="d">Detect models</button><div class="b" id="ms" style="margin-top:8px">[System State] not connected</div></div>
<div class="c"><label>Feature request or error log</label>
<textarea id="p" placeholder="e.g. Coin pickup system with DataStore saving and anti-exploit remotes"></textarea>
<div class="row"><button id="r">Build</button><button id="f" class="g">Fix error log</button></div></div>
<div id="o"></div>
<p class="b">Backend (Docker, Qdrant RAG, Studio plugin) is in the repo. See README.</p>
</div>
<script>
const $=i=>document.getElementById(i);
const B="https://api.groq.com/openai/v1";
let fast=null,heavy=null;
const SKIP=["whisper","guard","tts","playai","embed"];
const size=n=>{const m=n.toLowerCase().match(/(\d+(?:\.\d+)?)b/);return m?+m[1]:0};
async function detect(){
  const key=$("k").value.trim(); if(!key){$("ms").textContent="[System State] enter key";return}
  $("ms").textContent="[System State] detecting...";
  const t=performance.now();
  try{
    const r=await fetch(B+"/models",{headers:{Authorization:"Bearer "+key}});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const ids=(await r.json()).data.map(m=>m.id).filter(id=>!SKIP.some(s=>id.toLowerCase().includes(s)));
    const sized=ids.filter(i=>size(i)>0).sort((a,b)=>size(a)-size(b));
    const pool=sized.length?sized:ids;
    fast=pool[0];heavy=pool[pool.length-1];
    $("ms").textContent=`[System State] online ${Math.round(performance.now()-t)}ms | fast: ${fast} | heavy: ${heavy} | ${ids.length} models`;
  }catch(e){$("ms").textContent="[System State] error: "+e.message}
}
async function chat(model,sys,usr){
  const r=await fetch(B+"/chat/completions",{method:"POST",
    headers:{Authorization:"Bearer "+$("k").value.trim(),"Content-Type":"application/json"},
    body:JSON.stringify({model,temperature:.2,messages:[{role:"system",content:sys},{role:"user",content:usr}]})});
  if(!r.ok)throw new Error("Groq HTTP "+r.status);
  return (await r.json()).choices[0].message.content;
}
function card(title,text){
  const c=document.createElement("div");c.className="c";
  const h=document.createElement("div");h.className="h";
  const t=document.createElement("span");t.className="t";t.textContent=title;
  const b=document.createElement("button");b.className="g";b.textContent="Copy";
  b.onclick=()=>navigator.clipboard.writeText(text);
  const p=document.createElement("pre");p.textContent=text;
  h.append(t,b);c.append(h,p);$("o").append(c);
}
const P="You are a Roblox Planner. Split the feature into atomic ordered tasks with client/server boundaries and DataStore schema.";
const C="You are a Roblox Coder. Output strict-typed idiomatic Luau (--!strict), ModuleScripts, CollectionService, rate-limited RemoteEvents with server validation, Maid cleanup. Each file as a code block with its path.";
const R="You are a Roblox security reviewer. List exploits, memory leaks and perf issues, then give corrected code.";
const F="You are a Luau debugger. Isolate the root cause of this error and return the fixed block with patch notes.";
async function run(fix){
  if(!fast)await detect(); if(!fast)return;
  const q=$("p").value.trim(); if(!q)return;
  $("o").textContent="";$("r").disabled=$("f").disabled=true;
  try{
    if(fix){card("[Auto-Patch]",await chat(heavy,F,q))}
    else{
      const plan=await chat(heavy,P,q);card("[Architectural Blueprint]",plan);
      const code=await chat(fast,C,"Plan:\n"+plan);card("[Luau Implementation]",code);
      card("[Security & Optimization Audit]",await chat(heavy,R,code));
    }
  }catch(e){card("[Error]",e.message)}
  $("r").disabled=$("f").disabled=false;
}
$("d").onclick=detect;$("r").onclick=()=>run(false);$("f").onclick=()=>run(true);
</script></body></html>
